name: Build & Push Docker

# Construye y publica la imagen del frontend en Docker Hub en cada push a main.
# La version se auto-incrementa (v001, v002, ...) leyendo los tags ya existentes.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: restaurant-front-main-deploy
  cancel-in-progress: false

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: restaurante-frontend

jobs:
  build-and-push:
    # El servidor de destino es arm64, así que la imagen se construye en un runner
    # arm64 NATIVO (gratis en repos públicos). La alternativa —emular arm64 con QEMU
    # sobre un runner amd64— haría el build de Vite y la instalación de pnpm
    # interpretados, con un coste de tiempo desproporcionado para el mismo resultado.
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calcular siguiente version
        id: version
        run: |
          LATEST=$(curl -fsSL "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${IMAGE_NAME}/tags?page_size=100" 2>/dev/null \
            | jq -r '.results[].name' \
            | grep -E '^v[0-9]+$' \
            | sed 's/v//' \
            | sort -n | tail -1 || true)
          [ -z "$LATEST" ] && LATEST=0
          NEW=$((10#$LATEST + 1))
          VERSION="v$(printf '%03d' $NEW)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Siguiente tag: $VERSION"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Explícito aunque el runner ya sea arm64: si algún día vuelve a un runner
          # amd64, el build fallaría en vez de publicar en silencio una imagen que el
          # servidor no puede arrancar (`exec format error`).
          platforms: linux/arm64
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
          # VITE_* se compilan dentro del bundle: se pasan como build-args.
          #
          # `vars.VITE_API_BASE_URL` debe estar VACÍA salvo que la API viva de verdad en otro
          # host. Con valor, se hornea en la imagen y GANA sobre el env.js del pod: todos los
          # tenants llamarían al mismo hostname y el backend resolvería el negocio equivocado.
          # Vacía, la app usa el `/api` relativo de su propio host, que es lo correcto.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_API_PORT=${{ vars.VITE_API_PORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitOps: fija la version recien publicada en el manifiesto del repo de
      # despliegue (nleea/restaurante-ops). ArgoCD observa `k8s/` ahi y sincroniza
      # el cambio al cluster. Sin este paso el manifiesto seguiria apuntando a
      # `latest`, ArgoCD no veria ninguna revision nueva y el despliegue no saldria.
      #
      # Requiere el secret GITOPS_TOKEN: un PAT con permiso de escritura sobre
      # nleea/restaurante-ops (el GITHUB_TOKEN por defecto solo alcanza este repo).
      - name: Actualizar la version en el repo GitOps
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${DOCKER_USER}/${IMAGE_NAME}"
          git clone \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/nleea/restaurante-ops.git" \
            "$RUNNER_TEMP/gitops"
          cd "$RUNNER_TEMP/gitops"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            sed -i -E "s#${IMAGE}:[A-Za-z0-9._-]+#${IMAGE}:${VERSION}#g" \
              k8s/frontend.yaml

            if git diff --quiet -- k8s/frontend.yaml; then
              echo "Los manifiestos ya apuntan a ${VERSION}; nada que actualizar."
              exit 0
            fi

            git add k8s/frontend.yaml
            git commit -m "chore(deploy): frontend ${VERSION}"

            if git push origin HEAD:main; then
              echo "Manifiesto GitOps actualizado correctamente."
              exit 0
            fi

            echo "Push rechazado; reintentando (${attempt}/5)..."
            sleep $((attempt * 2))
          done

          echo "No se pudo actualizar restaurante-ops después de 5 intentos."
          exit 1
